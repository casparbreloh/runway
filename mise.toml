[tools]
node = "26"
aube = "1"

[settings]
experimental = true
lockfile = true

[env]
AUBE_CATALOG_MODE = "strict"

[deps.aube]
auto = true

[tasks.format]
run = "aube exec oxfmt '!aube-lock.yaml'"

[tasks.format-check]
run = "aube exec oxfmt --check '!aube-lock.yaml'"

[tasks.fallow]
run = "aube exec fallow dead-code --quiet --fail-on-issues && aube exec fallow dupes --quiet --fail-on-issues && aube exec fallow health --score --min-score 80 --quiet --format compact"

[tasks.lint]
run = "aube exec oxlint"

[tasks.typecheck]
run = "aube exec tsc --build"

[tasks.test]
run = "aube exec vitest run"

[tasks."test:e2e"]
run = "aube exec vitest run --config vitest.e2e.config.ts"
