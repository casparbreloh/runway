[tools]
node = "26"
aube = "1"

[settings]
experimental = true
lockfile = true

[env]
AUBE_CATALOG_MODE = "strict"

[deps.aube]
auto = true

[tasks.format]
run = "aube exec oxfmt '!aube-lock.yaml'"

[tasks.format-check]
run = "aube exec oxfmt --check '!aube-lock.yaml'"

[tasks.fallow]
run = "aube exec fallow dead-code --no-cache --quiet --format compact --fail-on-issues && aube exec fallow dupes --no-cache --quiet --format compact --fail-on-issues && aube exec fallow health --score --min-score 80 --no-cache --quiet --format compact"

[tasks.lint]
run = "aube exec oxlint"

[tasks.typecheck]
run = "aube exec tsc --build"

[tasks.test]
run = "aube exec vitest run"

[tasks."test:e2e"]
run = "aube exec vitest run --root packages/runway --config vitest.image.config.ts && node packages/runway/tests/live/cache-transfer.live.ts && node packages/runway/tests/live/artifact-recovery.live.ts && node packages/runway/tests/live/repository-recovery.live.ts && node packages/runway/tests/live/github-recovery.live.ts"
